spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVER CONFIGURATION
# ==========================================

server.port=8080
# ==========================================
# HIKARICP POOL OPTIMIZATION (SUPABASE POOLER FIX)
# ==========================================
# Isasara ng Hikari ang koneksyon pagkaraan ng 60 segundo bago pa man ito isara ng Supabase
spring.datasource.hikari.max-lifetime=60000

# Magpapadala ng keep-alive ping bawat 30 segundo para hindi ma-idle ang koneksyon
spring.datasource.hikari.keepalive-time=30000

# Maximum time na maghihintay ng bagong koneksyon (20 segundo)
spring.datasource.hikari.connection-timeout=20000

# Validation timeout kapag nagche-check ng koneksyon (3 segundo)
spring.datasource.hikari.validation-timeout=3000